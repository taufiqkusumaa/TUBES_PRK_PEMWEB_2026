<!doctype html>
<html lang="id">
  <!-- FITUR INFO PORTAL - ORANG 3 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-canvas font-sans text-slate-800" data-layout="public" data-api="api/kontak.php">
    <script type="text/x-template" id="page-template">
      <section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <p class="text-xs text-slate-500"><a href="{{root}}index.html">Beranda</a> / Kontak</p>
        <div class="mt-5 border-b border-slate-200 pb-5">
          <h1 class="text-3xl font-extrabold text-ink sm:text-4xl">Hubungi Kami</h1>
          <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">Kirim pertanyaan, saran, atau masukan kepada tim pengelola Pena Kampus.</p>
        </div>
        <div class="mt-8 grid gap-8 lg:grid-cols-12">
          <div class="space-y-5 lg:col-span-4">
            <div class="bg-ink p-6 text-white">
              <h2 class="text-xl font-bold">Informasi Redaksi</h2>
              <p class="mt-2 text-sm leading-6 text-slate-300">Gunakan formulir untuk menyampaikan pertanyaan dan masukan terkait konten portal.</p>
              <div class="mt-5 border-t border-white/15 pt-4">
                <p class="text-xs uppercase tracking-wider text-slate-400">Email demo</p>
                <p class="mt-1 font-semibold">redaksi@penakampus.test</p>
              </div>
            </div>
            <div class="border border-slate-200 bg-white p-5">
              <h3 class="font-bold text-ink">Cakupan layanan</h3>
              <p class="mt-2 text-sm leading-6 text-slate-600">Informasi dan berita seputar kegiatan akademik, kemahasiswaan, riset, prestasi, dan fakultas di Universitas Lampung.</p>
            </div>
          </div>
          <div class="lg:col-span-8">
            <div class="border border-slate-200 bg-white p-6 sm:p-8">
              <h2 class="text-xl font-extrabold text-ink">Kirim Pesan ke Redaksi</h2>
              <p class="mt-1 text-sm text-slate-500">Kolom bertanda * wajib diisi.</p>
            {{#success_flash_success}}
              <div class="flash success mt-4">{{success}}</div>
            {{/success_flash_success}} {{#error}}
              <div class="flash error mt-4">{{error2}}</div>
            {{/error}}
              <form method="post" class="mt-5 grid gap-4 sm:grid-cols-2">
                <input type="hidden" name="csrf_token" value="{{csrf_token}}">
                <div><label class="mb-1 block text-sm font-semibold">Nama lengkap *</label><input class="form-control" name="name" maxlength="120" required value="{{oldInput_name}}"></div>
                <div><label class="mb-1 block text-sm font-semibold">Alamat email *</label><input class="form-control" type="email" name="email" maxlength="190" required value="{{oldInput_email}}"></div>
                <div class="sm:col-span-2"><label class="mb-1 block text-sm font-semibold">Subjek pesan *</label><input class="form-control" name="subject" maxlength="180" required value="{{oldInput_subject}}"></div>
                <div class="sm:col-span-2"><label class="mb-1 block text-sm font-semibold">Isi pesan *</label><textarea class="form-control" name="message" rows="6" maxlength="10000" required>{{oldInput_message}}</textarea></div>
                <div class="sm:col-span-2">
                  <p class="mb-3 text-xs leading-5 text-slate-500">Informasi kontak digunakan untuk menanggapi pesan yang kamu kirim.</p>
                  <button class="btn-primary">Kirim Pesan</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
