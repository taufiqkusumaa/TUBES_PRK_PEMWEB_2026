            <p class="mt-3 text-sm leading-7 text-slate-600">Konten portal dikelola oleh administrator dan editor fakultas. Setiap artikel memiliki kategori, penulis, dan status publikasi agar pengelolaan informasi lebih teratur.</p>
          </div>
          <div class="bg-white p-6 border border-slate-200">

              <li class="flex gap-3"><span class="material-symbols-outlined text-bluebrand">balance</span><span><strong>Berimbang</strong><br><span class="text-slate-500">Menyajikan informasi secara proporsional.</span></span></li>
              <li class="flex gap-3"><span class="material-symbols-outlined text-bluebrand">visibility</span><span><strong>Transparan</strong><br><span class="text-slate-500">Menampilkan identitas penulis dan waktu publikasi.</span></span></li>
