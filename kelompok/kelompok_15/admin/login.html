<!doctype html>
<html lang="id">
  <!-- FITUR LOGIN ADMIN - ORANG 4 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk | Pena Kampus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/app.js"></script>
  </head>
  <body class="min-h-screen bg-white font-sans" data-layout="login" data-api="../api/admin_login.php">
    <script type="text/x-template" id="page-template">
      <div class="grid min-h-screen lg:grid-cols-2">
        <section class="relative hidden overflow-hidden bg-ink p-12 text-white lg:flex lg:flex-col lg:justify-between">
          <div>
            <a href="{{root}}index.html" class="flex items-center gap-3"><span class="grid h-12 w-12 place-items-center rounded bg-amberbrand text-ink"><span class="material-symbols-outlined text-3xl">newspaper</span></span><span class="text-2xl font-extrabold">Pena Kampus</span></a>
            <div class="mt-24 max-w-xl">
              <p class="text-xs font-bold uppercase tracking-[.2em] text-amberbrand">Ruang Redaksi</p>
              <h1 class="mt-4 text-4xl font-extrabold leading-tight">Kelola informasi dari seluruh lingkungan Universitas Lampung.</h1>
              <p class="mt-5 text-base leading-8 text-slate-300">Masuk untuk mengelola berita, kategori, dan informasi kampus melalui satu sistem editorial.</p>
            </div>
          </div>
          <p class="text-xs text-slate-400">Pena Kampus · Proyek akademik mahasiswa</p>
          <div class="pointer-events-none absolute -bottom-24 -right-20 h-80 w-80 rounded-full border-[40px] border-white/5"></div>
        </section>
        <section class="flex items-center justify-center px-5 py-12">
          <div class="w-full max-w-md">
            <a href="{{root}}index.html" class="mb-12 inline-flex items-center gap-2 text-sm font-semibold text-bluebrand lg:hidden"><span class="material-symbols-outlined">arrow_back</span>Kembali ke portal</a>
            <div class="mb-8">
              <p class="text-xs font-bold uppercase tracking-[.18em] text-bluebrand">Pena Kampus CMS</p>
              <h2 class="mt-3 text-3xl font-extrabold text-ink">Selamat Datang Kembali</h2>
              <p class="mt-2 text-sm leading-6 text-slate-500">Masuk menggunakan akun administrator atau editor.</p>
            </div>
          {{#success}}
            <div class="flash success">{{success2}}</div>
          {{/success}}{{#flashError}}
            <div class="flash error">{{flashError2}}</div>
          {{/flashError}}{{#error}}
            <div class="flash error">{{error2}}</div>
          {{/error}}
            <form method="post" class="space-y-5">
              <input type="hidden" name="csrf_token" value="{{csrf_token}}">
              <div><label class="mb-2 block text-sm font-semibold text-slate-700">Email</label><input class="form-control h-12" type="email" name="email" autocomplete="username" placeholder="nama@email.com" required></div>
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Kata sandi</label>
                <div class="relative"><input id="password" class="form-control h-12 pr-12" type="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required><button type="button" id="toggle-password" class="absolute right-3 top-3 text-slate-500" aria-label="Tampilkan kata sandi"><span class="material-symbols-outlined">visibility</span></button></div>
              </div>
              <button class="btn-primary h-12 w-full">Masuk ke Dashboard <span class="material-symbols-outlined">arrow_forward</span></button>
            </form>
            <p class="mt-7 text-center text-xs leading-5 text-slate-500">Akses hanya untuk administrator dan editor yang terdaftar.</p>
            <p class="mt-5 text-center"><a href="{{root}}index.html" class="text-sm font-semibold text-bluebrand hover:underline">← Kembali ke portal publik</a></p>
          </div>
        </section>
      </div>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
