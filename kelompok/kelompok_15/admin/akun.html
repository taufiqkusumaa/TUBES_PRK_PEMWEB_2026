<!doctype html>
<html lang="id">
  <!-- FITUR MANAJEMEN AKUN & HAK AKSES - ORANG 4 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/app.js"></script>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-slate-800" data-layout="admin" data-api="../api/admin_akun.php">
    <script type="text/x-template" id="page-template">
    {{#msg_flash_success}}
      <div class="flash success">{{msg}}</div>
    {{/msg_flash_success}}{{#msg_flash_error}}
      <div class="flash error">{{msg2}}</div>
    {{/msg_flash_error}}
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-xl font-extrabold text-ink">Pengguna Sistem</h2>
          <p class="mt-1 text-sm text-slate-500">Kelola administrator dan editor fakultas.</p>
        </div>
        <a class="btn-primary" href="{{root}}admin/akun-form.html">+ Tambah Pengguna</a>
      </div>
      <form class="mb-5 grid gap-3 border border-slate-200 bg-white p-4 sm:grid-cols-4">
        <input class="form-control sm:col-span-2" name="q" value="{{q}}" placeholder="Cari nama atau email">
        <select class="form-control" name="role">
          <option value="">Semua role</option>
          <option value="admin" {{role_admin_selected}}>Admin</option>
          <option value="editor" {{role_editor_selected}}>Editor</option>
        </select>
        <button class="btn-primary">Cari</button>
      </form>
      <div class="overflow-x-auto border border-slate-200 bg-white">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Pengguna</th>
              <th>Role</th>
              <th>Fakultas</th>
              <th>Status</th>
              <th>Login Terakhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
          {{#users}}
            <tr>
              <td>
                <p class="font-semibold text-ink">{{u_name}}</p>
                <p class="text-xs text-slate-500">{{u_email}}</p>
              </td>
              <td><span class="status {{roleClass}}">{{ucfirst_u_role}}</span></td>
              <td>{{u_faculty_name_Semua_fakultas}}</td>
              <td><span class="status status-{{u_status}}">{{ucfirst_u_status}}</span></td>
              <td class="text-xs text-slate-500">{{date_id_u_last_login_at}}</td>
              <td class="whitespace-nowrap">
                <a class="font-semibold text-bluebrand" href="{{url_admin_akun_form_html_id_u_id}}">Edit</a>
              {{#int_u_id_int_current_user_id}}
                <form class="ml-3 inline" method="post" action="{{root}}api/admin_users_toggle.php" data-confirm="Ubah status akun ini?"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{int_u_id}}"><input type="hidden" name="status" value="{{u_status_active_inactive_active}}"><button class="font-semibold text-red-700">{{u_status_active_Nonaktifkan_Aktifkan}}</button></form>
                <form class="ml-3 inline" method="post" action="{{root}}api/admin_users_delete.php" data-confirm="Hapus akun ini?"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{int_u_id}}"><button class="font-semibold text-red-700">Hapus</button></form>
              {{/int_u_id_int_current_user_id}}
              </td>
            </tr>
          {{/users}}{{#users2}}
            <tr>
              <td colspan="6" class="py-10 text-center text-slate-500">Pengguna tidak ditemukan.</td>
            </tr>
          {{/users2}}
          </tbody>
        </table>
      </div>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
