<!doctype html>
<html lang="id">
  <!-- FITUR MODERASI KOMENTAR - ORANG 4 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/app.js"></script>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-slate-800" data-layout="admin" data-api="../api/admin_komentar.php">
    <script type="text/x-template" id="page-template">
    {{#msg_flash_success}}
      <div class="flash success">{{msg}}</div>
    {{/msg_flash_success}}
      <div class="mb-5">
        <h2 class="text-xl font-extrabold text-ink">Moderasi Komentar</h2>
        <p class="mt-1 text-sm text-slate-500">Tinjau komentar sebelum ditampilkan kepada pembaca.</p>
      </div>
      <div class="mb-5 grid gap-3 sm:grid-cols-3">
      {{#moderationStatuses}}
        <div class="border border-slate-200 bg-white p-4">
          <p class="text-xs font-semibold text-slate-500">{{label}}</p>
          <p class="mt-2 text-2xl font-extrabold text-ink">{{counts_k}}</p>
        </div>
      {{/moderationStatuses}}
      </div>
      <form class="mb-5 grid gap-3 border border-slate-200 bg-white p-4 sm:grid-cols-4">
        <input class="form-control sm:col-span-2" name="q" value="{{q}}" placeholder="Cari nama, komentar, atau artikel">
        <select class="form-control" name="status">
          <option value="pending" {{status_pending_selected}}>Menunggu</option>
          <option value="approved" {{status_approved_selected}}>Disetujui</option>
          <option value="rejected" {{status_rejected_selected}}>Ditolak</option>
          <option value="all" {{status_all_selected}}>Semua status</option>
        </select>
        <button class="btn-primary">Filter</button>
      </form>
      <div class="space-y-3">
      {{#comments}}
        <article class="border border-slate-200 bg-white p-5">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <p class="font-bold text-ink">{{c_commenter_name}} <span class="font-normal text-slate-500">· {{c_commenter_email_Tanpa_email}}</span></p>
              <p class="mt-1 text-xs text-slate-500">Pada artikel <a class="font-semibold text-bluebrand" href="{{url_detail_html_slug_c_article_slug}}" target="_blank">{{c_article_title}}</a> · {{c_faculty_name_Universitas}} · {{date_id_c_created_at_true}}</p>
            </div>
            <span class="status status-{{c_status}}">{{ucfirst_c_status}}</span>
          </div>
          <p class="mt-4 whitespace-pre-line text-sm leading-6 text-slate-700">{{c_content}}</p>
          <div class="mt-4 flex flex-wrap gap-2">
          {{#c_status_approved}}
            <form method="post" action="{{root}}api/admin_comments_action.php"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{int_c_id}}"><input type="hidden" name="status" value="approved"><button class="btn-primary">Setujui</button></form>
          {{/c_status_approved}}{{#c_status_rejected}}
            <form method="post" action="{{root}}api/admin_comments_action.php"><input type="hidden" name="csrf_token" value="{{csrf_token2}}"><input type="hidden" name="id" value="{{int_c_id2}}"><input type="hidden" name="status" value="rejected"><button class="btn-secondary">Tolak</button></form>
          {{/c_status_rejected}}
            <form method="post" action="{{root}}api/admin_comments_action.php" data-confirm="Hapus komentar ini?"><input type="hidden" name="csrf_token" value="{{csrf_token3}}"><input type="hidden" name="id" value="{{int_c_id3}}"><input type="hidden" name="status" value="delete"><button class="btn-danger">Hapus</button></form>
          </div>
        </article>
      {{/comments}}{{#comments2}}
        <div class="border border-dashed border-slate-300 bg-white p-12 text-center text-sm text-slate-500">Tidak ada komentar pada filter ini.</div>
      {{/comments2}}
      </div>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
