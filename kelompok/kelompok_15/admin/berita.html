<!doctype html>
<html lang="id">
  <!-- FITUR CMS BERITA (DRAFT/PUBLISH/UPLOAD) - ORANG 5 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script type="module" src="../js/app.js"></script>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-slate-800" data-layout="admin" data-api="../api/admin_berita.php">
    <script type="text/x-template" id="page-template">
    {{#msg_flash_success}}
      <div class="flash success">{{msg}}</div>
    {{/msg_flash_success}}{{#msg_flash_error}}
      <div class="flash error">{{msg2}}</div>
    {{/msg_flash_error}}
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-sm text-slate-500">Kelola seluruh artikel yang menjadi tanggung jawab akunmu.</p>
          <h2 class="mt-1 text-xl font-extrabold text-ink">Daftar Artikel</h2>
        </div>
        <a class="btn-primary" href="{{root}}admin/berita-form.html"><span class="material-symbols-outlined">add</span>Tambah Berita</a>
      </div>
      <form method="get" class="mb-5 grid gap-3 border border-slate-200 bg-white p-4 sm:grid-cols-4">
        <input class="form-control sm:col-span-2" name="q" value="{{q}}" placeholder="Cari judul berita">
        <select class="form-control" name="kategori">
          <option value="0">Semua kategori</option>
        {{#categories}}
          <option value="{{int_c_id}}" {{category_int_c_id_selected}}>{{c_name}}</option>
        {{/categories}}
        </select>
        <select class="form-control" name="status">
          <option value="">Semua status</option>
        {{#draft_published_archived}}
          <option value="{{s}}" {{status_s_selected}}>{{ucfirst_s}}</option>
        {{/draft_published_archived}}
        </select>
        <div class="flex gap-2 sm:col-span-4"><button class="btn-primary">Filter</button><a class="btn-secondary" href="{{root}}admin/berita.html">Reset</a></div>
      </form>
      <div class="overflow-hidden border border-slate-200 bg-white">
        <div class="overflow-x-auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Artikel</th>
                <th>Fakultas</th>
                <th>Kategori</th>
                <th>Status</th>
                <th>Pembaruan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
            {{#articles}}
              <tr>
                <td class="min-w-[260px]">
                  <div class="flex items-center gap-3">
                    <img class="h-14 w-20 rounded object-cover" src="{{article_image_a_featured_image}}" alt="">
                    <div>
                      <a class="font-semibold text-ink hover:text-bluebrand" href="{{url_admin_berita_form_html_id_a_id}}">{{a_title}}</a>
                      <p class="mt-1 text-xs text-slate-500">Oleh {{a_author_name}}</p>
                    </div>
                  </div>
                </td>
                <td>{{a_faculty_name_Universitas}}</td>
                <td>{{a_category_name}}</td>
                <td><span class="status status-{{a_status}}">{{ucfirst_a_status}}</span></td>
                <td class="whitespace-nowrap text-xs text-slate-500">{{date_id_a_updated_at}}</td>
                <td>
                  <div class="flex items-center gap-2">
                    <a class="text-sm font-semibold text-bluebrand" href="{{url_admin_berita_form_html_id_a_id2}}">Edit</a>
                    <form method="post" action="{{root}}api/admin_articles_delete.php" data-confirm="Hapus artikel ini? Komentar terkait juga akan dihapus."><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input type="hidden" name="id" value="{{int_a_id}}"><button class="text-sm font-semibold text-red-700">Hapus</button></form>
                  </div>
                </td>
              </tr>
            {{/articles}} {{#articles2}}
              <tr>
                <td colspan="6" class="py-12 text-center text-slate-500">Tidak ada artikel yang cocok.</td>
              </tr>
            {{/articles2}}
            </tbody>
          </table>
        </div>
      </div>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
