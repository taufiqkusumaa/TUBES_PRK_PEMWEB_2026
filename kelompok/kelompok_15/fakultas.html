<!doctype html>
<html lang="id">
  <!-- FITUR DAFTAR PER FAKULTAS - ORANG 2 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-canvas font-sans text-slate-800" data-layout="public" data-api="api/fakultas.php">
    <script type="text/x-template" id="page-template">
      <section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
        <p class="text-xs text-slate-500"><a href="{{root}}index.html">Beranda</a> / <a href="{{root}}berita.html">Fakultas</a> / {{currentFaculty_code}} </p>
        <div class="mt-4 overflow-hidden bg-ink text-white">
          <div class="grid items-center gap-6 p-7 md:grid-cols-12 md:p-10">
            <div class="md:col-span-8">
              <span class="inline-block bg-amberbrand px-2 py-1 text-xs font-extrabold text-ink"> {{currentFaculty_code2}} </span>
              <h1 class="mt-4 text-3xl font-extrabold leading-tight sm:text-4xl"> {{currentFaculty_name}} </h1>
              <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-200"> {{facultyDescription}} </p>
            </div>
            <div class="border-t border-white/20 pt-5 md:col-span-4 md:border-l md:border-t-0 md:pl-7 md:pt-0">
              <p class="text-sm text-slate-300">Berita dipublikasikan</p>
              <p class="mt-1 text-4xl font-extrabold text-amberbrand">{{total}}</p>
              <p class="mt-1 text-xs text-slate-300">artikel tersedia</p>
            </div>
          </div>
        </div>
        <nav class="mt-7 flex flex-wrap gap-2" aria-label="Pilih fakultas"> {{#facultiesForTabs}}  <a href="{{tabUrl}}" {{isActiveFaculty_aria_current_page}} class="border px-3 py-2 text-xs font-bold {{tabClass}}"> {{tabFaculty_code}} </a> {{/facultiesForTabs}} </nav>
        <form method="get" action="{{root}}fakultas.html" class="mt-6 grid gap-3 border border-slate-200 bg-white p-4 sm:grid-cols-12">
          <input type="hidden" name="slug" value="{{currentFaculty_slug}}">
          <div class="sm:col-span-7"><label for="faculty-search" class="mb-1 block text-xs font-bold text-slate-600">Cari berita di fakultas ini</label><input id="faculty-search" class="form-control" type="search" name="q" value="{{q}}" placeholder="Cari berita..."></div>
          <div class="sm:col-span-3">
            <label for="faculty-category" class="mb-1 block text-xs font-bold text-slate-600">Kategori</label>
            <select id="faculty-category" class="form-control" name="kategori">
              <option value="0">Semua kategori</option>
            {{#categories}}
              <option value="{{int_category_id}}" {{categoryId_int_category_id_selected}}> {{category_name}} </option>
            {{/categories}}
            </select>
          </div>
          <div class="flex items-end sm:col-span-2"><button type="submit" class="btn-primary w-full">Cari</button></div>
        </form>
        <div class="mt-7 flex items-end justify-between border-b border-slate-200 pb-3">
          <h2 class="text-2xl font-extrabold text-ink">Berita {{currentFaculty_code3}}</h2>
          <span class="text-sm text-slate-500">{{total2}} artikel</span>
        </div>
      {{#articles}}
        <div class="faculty-news-grid mt-5 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"> {{#articles2}} {{>card}} {{/articles2}} </div>
      {{/articles}}{{#otherwise_articles}}
        <div class="mt-5 border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500"> Belum ada berita untuk {{currentFaculty_code4}} atau berita tidak cocok dengan filter. </div>
      {{/otherwise_articles}} {{#hasPagination}}
        <nav class="mt-8 flex justify-center gap-2" aria-label="Navigasi halaman berita"> {{#pageLinks}}  <a class="border px-3 py-2 text-sm {{pageClass}}" href="?{{http_build_query_queryParams}}" {{i_page_aria_current_page}}> {{i}} </a> {{/pageLinks}} </nav>
      {{/hasPagination}}
      </section>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
