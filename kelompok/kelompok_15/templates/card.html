<!-- KOMPONEN KARTU BERITA - ORANG 2 -->
<article class="group overflow-hidden rounded-md border border-slate-200 bg-white">
  <a href="{{href}}" class="block aspect-[16/9] overflow-hidden bg-slate-100"><img class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.02]" src="{{image}}" alt="{{title}}" loading="lazy"></a>
  <div class="p-4">
    <div class="flex flex-wrap gap-2 text-[11px] font-bold uppercase tracking-wide"><span class="bg-slate-100 px-2 py-1 text-slate-700">{{faculty}}</span><span class="bg-orange-50 px-2 py-1 text-orange-800">{{category}}</span></div>
    <h3 class="mt-3 text-lg font-semibold leading-snug text-slate-900"><a href="{{href}}" class="hover:text-blue-800">{{title}}</a></h3>
    <p class="mt-2 text-sm leading-6 text-slate-600">{{summary}}</p>
    <div class="mt-4 flex items-center justify-between gap-2 text-xs text-slate-500"><span>{{author}}</span><span>{{date}}</span></div>
  </div>
</article>
