<!-- KOMPONEN KARTU BERITA - ORANG 2 -->
<article class="flex gap-3 border-b border-slate-200 py-3">
  <a href="{{href}}" class="h-20 w-24 shrink-0 overflow-hidden rounded-sm bg-slate-100"><img class="h-full w-full object-cover" src="{{image}}" alt="" loading="lazy"></a>
  <div class="min-w-0">
    <p class="text-xs font-bold uppercase tracking-wide text-blue-800">{{faculty}}</p>
    <a href="{{href}}" class="mt-1 block font-semibold leading-snug text-slate-900 hover:text-blue-800">{{title}}</a>
    <p class="mt-1 text-xs text-slate-500">{{date}}</p>
  </div>
</article>
