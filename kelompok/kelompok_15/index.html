<!doctype html>
<html lang="id">
  <!-- HALAMAN BERANDA - ORANG 1 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-canvas font-sans text-slate-800" data-layout="public" data-api="api/index.php">
    <script type="text/x-template" id="page-template">
      <section class="mx-auto max-w-7xl px-4 pt-7 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2 border-b border-slate-200 pb-3 text-xs"><span class="bg-amberbrand px-2 py-1 font-extrabold text-ink">TERKINI</span><span class="text-slate-600">Informasi dan berita dari seluruh lingkungan Universitas Lampung.</span></div>
      {{#featured}}
        <div class="mt-6 grid gap-6 lg:grid-cols-12">
          <div class="relative min-h-[360px] overflow-hidden bg-ink lg:col-span-8">
            <img src="{{article_image_featured_featured_image}}" alt="" class="absolute inset-0 h-full w-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/40 to-transparent"></div>
            <div class="relative flex min-h-[360px] max-w-3xl flex-col justify-end p-6 text-white sm:p-9">
              <div class="mb-3 flex flex-wrap gap-2"><span class="bg-amberbrand px-2 py-1 text-[11px] font-bold uppercase text-ink">Berita Unggulan</span><span class="bg-white/15 px-2 py-1 text-[11px] font-bold uppercase">{{featured_faculty_name_Universitas}}</span></div>
              <p class="text-xs font-semibold uppercase tracking-wider text-orange-200">{{featured_category_name}}</p>
              <h1 class="mt-2 text-3xl font-extrabold leading-tight sm:text-4xl"><a href="{{featuredUrl}}">{{featured_title}}</a></h1>
              <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-200">{{featuredSummary}}</p>
              <div class="mt-5 flex flex-wrap items-center gap-3 text-xs text-slate-200"><span>{{featured_author_name}}</span><span>•</span><span>{{date_id_featured_published_at}}</span><a class="ml-2 inline-flex items-center gap-1 font-bold text-amber-300 hover:text-white" href="{{featuredUrl2}}">Baca selengkapnya <span class="material-symbols-outlined text-sm">arrow_forward</span></a></div>
            </div>
          </div>
          <aside class="border border-slate-200 bg-white p-5 lg:col-span-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <h2 class="text-lg font-bold text-ink">Berita Populer</h2>
              <span class="text-xs text-slate-500">Pilihan pembaca</span>
            </div>
          {{#popular}}{{>compact}}{{/popular}} {{#popular2}}
            <p class="py-5 text-sm text-slate-500">Belum ada berita populer.</p>
          {{/popular2}}
          </aside>
        </div>
      {{/featured}}{{#otherwise_featured}}
        <div class="mt-6 bg-ink px-6 py-12 text-white">
          <p class="text-sm font-bold uppercase tracking-wider text-amber-300">Pena Kampus</p>
          <h1 class="mt-3 max-w-3xl text-4xl font-extrabold">Berita dan informasi dari seluruh Universitas Lampung.</h1>
          <p class="mt-4 text-slate-200">Artikel akan tampil di sini setelah editor menerbitkannya.</p>
        </div>
      {{/otherwise_featured}}
      </section>
      <section class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
        <div class="mb-6 flex items-end justify-between border-b border-slate-200 pb-3">
          <div>
            <p class="text-xs font-bold uppercase tracking-[.16em] text-bluebrand">Jelajahi kanal</p>
            <h2 class="mt-1 text-2xl font-extrabold text-ink">Berita Berdasarkan Fakultas</h2>
          </div>
          <a href="{{root}}berita.html" class="text-sm font-bold text-bluebrand hover:text-ink">Semua berita →</a>
        </div>
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-8"> {{#faculties}}<a href="{{url_fakultas_html_slug_f_slug}}" class="faculty-tile"><span class="block text-lg font-extrabold text-ink">{{f_code}}</span><span class="mt-1 block text-xs leading-5 text-slate-600">{{f_name}}</span></a>{{/faculties}} </div>
      </section>
      <section class="mx-auto max-w-7xl px-4 pb-4 sm:px-6 lg:px-8">
        <div class="mb-6 flex items-end justify-between border-b border-slate-200 pb-3">
          <div>
            <p class="text-xs font-bold uppercase tracking-[.16em] text-bluebrand">Kabar terbaru</p>
            <h2 class="mt-1 text-2xl font-extrabold text-ink">Arsip Berita Terbaru</h2>
          </div>
          <a href="{{root}}berita.html" class="text-sm font-bold text-bluebrand hover:text-ink">Lihat semua →</a>
        </div>
      {{#latest}}
        <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{{#latest2}}{{>card}}{{/latest2}}</div>
      {{/latest}}{{#otherwise_latest}}
        <div class="border border-dashed border-slate-300 bg-white p-10 text-center text-sm text-slate-500">Belum ada berita yang dipublikasikan.</div>
      {{/otherwise_latest}}
      </section>
      <section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center justify-between gap-4 border-y border-slate-200 py-5">
          <div>
            <h2 class="text-xl font-extrabold text-ink">Jelajahi kategori berita</h2>
            <p class="mt-1 text-sm text-slate-500">Pilih topik yang ingin kamu baca.</p>
          </div>
          <div class="flex flex-wrap gap-2">{{#categories}}<a href="{{url_berita_html_kategori_cat_id}}" class="border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:border-ink hover:text-ink">{{cat_name}}</a>{{/categories}}</div>
        </div>
      </section>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
