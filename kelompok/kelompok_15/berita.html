<!doctype html>
<html lang="id">
  <!-- FITUR KATALOG/FILTER/PENCARIAN - ORANG 2 -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pena Kampus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="bg-canvas font-sans text-slate-800" data-layout="public" data-api="api/berita.php">
    <script type="text/x-template" id="page-template">
      <section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="border-b border-slate-200 pb-5">
          <p class="text-xs font-semibold text-slate-500"><a href="{{root}}index.html">Beranda</a> / Berita</p>
          <h1 class="mt-3 text-3xl font-extrabold tracking-tight text-ink sm:text-4xl">Semua Berita</h1>
          <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">Temukan kabar akademik, kegiatan mahasiswa, riset, prestasi, dan informasi dari seluruh fakultas Universitas Lampung.</p>
        </div>
        <form method="get" class="mt-6 grid gap-3 border border-slate-200 bg-white p-4 md:grid-cols-12">
          <div class="md:col-span-5"><label class="mb-1 block text-xs font-bold text-slate-600">Cari berita</label><input class="form-control" type="search" name="q" value="{{q}}" placeholder="Cari judul atau isi berita..."></div>
          <div class="md:col-span-3">
            <label class="mb-1 block text-xs font-bold text-slate-600">Fakultas</label>
            <select class="form-control" name="fakultas">
              <option value="0">Semua fakultas</option>
            {{#faculties}}
              <option value="{{int_f_id}}" {{facultyId_int_f_id_selected}}>{{f_code_f_name}}</option>
            {{/faculties}}
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="mb-1 block text-xs font-bold text-slate-600">Kategori</label>
            <select class="form-control" name="kategori">
              <option value="0">Semua kategori</option>
            {{#categories}}
              <option value="{{int_c_id}}" {{categoryId_int_c_id_selected}}>{{c_name}}</option>
            {{/categories}}
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="mb-1 block text-xs font-bold text-slate-600">Urutkan</label>
            <select class="form-control" name="sort">
              <option value="terbaru" {{sort_terbaru_selected}}>Terbaru</option>
              <option value="terlama" {{sort_terlama_selected}}>Terlama</option>
              <option value="terpopuler" {{sort_terpopuler_selected}}>Terpopuler</option>
            </select>
          </div>
          <div class="flex gap-2 md:col-span-12"><button class="btn-primary" type="submit"><span class="material-symbols-outlined text-lg">search</span>Terapkan</button><a class="btn-secondary" href="{{root}}berita.html">Reset</a></div>
        </form>
        <div class="mt-7 flex items-center justify-between">
          <p class="text-sm text-slate-600">Menampilkan <strong>{{count_articles}}</strong> dari <strong>{{total}}</strong> berita</p>
        {{#q2}}
          <span class="text-xs text-slate-500">Kata kunci: “{{q3}}”</span>
        {{/q2}}
        </div>
      {{#articles}}
        <div class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{{#articles2}}{{>card}}{{/articles2}}</div>
      {{/articles}}{{#otherwise_articles}}
        <div class="mt-5 border border-dashed border-slate-300 bg-white p-12 text-center">
          <span class="material-symbols-outlined text-4xl text-slate-400">search_off</span>
          <h2 class="mt-3 font-bold text-ink">Berita tidak ditemukan</h2>
          <p class="mt-1 text-sm text-slate-500">Coba kata kunci atau filter yang berbeda.</p>
        </div>
      {{/otherwise_articles}} {{#hasPagination}}
        <nav class="mt-8 flex flex-wrap items-center justify-center gap-2" aria-label="Pagination">{{#pageLinks}}<a class="border px-3 py-2 text-sm {{pageClass}}" href="?{{http_build_query_query}}">{{i}}</a>{{/pageLinks}}</nav>
      {{/hasPagination}}
      </section>
    </script>
    <noscript>Aktifkan JavaScript untuk membuka Pena Kampus.</noscript>
  </body>
</html>
